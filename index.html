<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的时光</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #121212;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e0e0e0;
}

/* 竖长正方形卡片 */
.card {
  background: #1a1a1a;
  border-radius: 24px;
  width: 380px;
  height: 620px;
  padding: 60px 40px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 215, 0, 0.15);
  text-align: center;
  animation: cardIn 0.8s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.avatar-container {
  position: relative;
  display: flex;
  justify-content: space-between;
  width: 100%;
  margin-top: 20px;
  margin-bottom: 20px;
}

/* 中间连线 */
.avatar-container::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 2px;
  background: rgba(255, 215, 0, 0.4);
  transform: translateY(-50%);
  z-index: 1;
}

/* 中间 LOVE */
.avatar-container::after {
  content: 'LOVE';
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: #1a1a1a;
  padding: 0 12px;
  color: #ffd700;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 2px;
  z-index: 2;
}

.avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 215, 0, 0.5);
  position: relative;
  z-index: 3;
  background: #222;
}

.birthday-row {
  display: flex;
  justify-content: space-between;
  width: 100%;
  font-size: 15px;
  color: #ffd700;
  margin-bottom: 40px;
}

.title {
  font-size: 24px;
  color: #f5f5f5;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 15px;
  color: #aaa;
  margin-bottom: 30px;
}

.day {
  font-size: 72px;
  font-weight: 700;
  color: #ffd700;
  margin-bottom: 10px;
}

.day-label {
  font-size: 16px;
  color: #ccc;
  margin-bottom: 30px;
}

.divider {
  width: 50px;
  height: 2px;
  background: #ffd700;
  border-radius: 1px;
  margin-bottom: 30px;
  opacity: 0.5;
}

.desc {
  font-size: 15px;
  color: #bbbbbb;
}
</style>
</head>
<body>

<div class="card">
  <div class="avatar-container">
    <img src="photo1.jpg" class="avatar" alt="">
    <img src="photo2.jpg" class="avatar" alt="">
  </div>

  <div class="birthday-row">
    <div>06月16日</div>
    <div>01月10日</div>
  </div>

  <div class="title">我们在一起的时光</div>
  <div class="subtitle">2025.05.20</div>

  <div class="day" id="day">0</div>
  <div class="day-label">天</div>

  <div class="divider"></div>
  <div class="desc">于时光里，并肩同行</div>
</div>

<script>
const startTimestamp = 1747728000000;

function updateDay() {
  const now = Date.now();
  const diff = now - startTimestamp;
  const day = Math.max(0, Math.floor(diff / 86400000));
  document.getElementById('day').innerText = day;
}

updateDay();
setInterval(updateDay, 60000);
</script>
</body>
</html>
